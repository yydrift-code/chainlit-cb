version: '3.8'

services:
  realtime-assistant:
    build: 
      context: .
      dockerfile: Dockerfile
      cache_from:
        - python:3.11-alpine
    container_name: realtime-assistant
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CHAINLIT_HOST=0.0.0.0
      - CHAINLIT_PORT=8888
      - CHAINLIT_PUBLIC_URL=https://realtime-demo.renovavision.tech
    volumes: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - caddy-network

networks:
  caddy-network:
    external: true
